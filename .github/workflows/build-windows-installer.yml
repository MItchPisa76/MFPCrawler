name: Build Windows 64-bit Installer
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'local-network'
        type: choice
        options:
        - local-network
        - production

  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Controlla il codice sorgente
      uses: actions/checkout@v4

    - name: Configura Java (JDK 21 x64)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64
        cache: 'maven'

    <!-- Iniezione del certificato SSL dal Repository Secret se richiesto -->
    - name: Importa certificato SSL nel cacerts della JDK
      if: ${{ github.event_name == 'release' || inputs.environment == 'local-network' }}
      shell: bash
      run: |
        if [ -n "${{ secrets.LOCAL_SERVER_CERT }}" ]; then
          mkdir -p src/main/resources/certs
          echo "${{ secrets.LOCAL_SERVER_CERT }}" > src/main/resources/certs/server.crt
          "$JAVA_HOME/bin/keytool" -importcert -alias resolve-server \
            -file "src/main/resources/certs/server.crt" \
            -keystore "$JAVA_HOME/lib/security/cacerts" \
            -storepass changeit -noprompt
        fi

    - name: Costruisci il progetto e l'installer con Maven
      run: mvn clean verify

    <!-- Aggiornamento automatico della tabella nel README ad ogni nuova release -->
    - name: Aggiungi nuova versione al README.md
      if: ${{ github.event_name == 'release' }}
      shell: bash
      run: |
        TAG_NAME="${{ github.event.release.tag_name }}"
        EXE_FILE=$(basename $(ls target/dist/*.exe | head -n 1))
        DOWNLOAD_URL="https://github.com/MitchPisa76/MFPCrawler/releases/download/$TAG_NAME/$EXE_FILE"
        NEW_ROW="| **$TAG_NAME** | [⚡ Scarica $EXE_FILE]($DOWNLOAD_URL) |"
        
        sed -i "/<!-- DOWNLOAD_TABLE_MARKER -->/a $NEW_ROW" README.md
        
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: aggiunto link download per la versione $TAG_NAME [skip ci]" && git push)

    <!-- Upload del file eseguibile allegato alla Release -->
    - name: Carica l'installer nella Release di GitHub
      if: ${{ github.event_name == 'release' }}
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    <!-- Upload dell'eseguibile come Artifact se avviato a mano dal pulsante -->
    - name: Salva l'installer come Artifact (dalla pressione del pulsante manuale)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: MFPCrawler-Windows-Installer
        path: target/dist/
