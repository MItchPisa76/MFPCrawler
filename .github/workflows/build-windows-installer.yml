name: Build Windows 64-bit Installer

on:
  release:
    types: [published]

permissions:
  contents: write  # Required for uploading files to releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Controlla il codice sorgente
      uses: actions/checkout@v4

    - name: Configura Java (JDK 21 x64)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64
        cache: 'maven'

    - name: Costruisci il progetto e l'installer con Maven
      run: mvn clean verify

    - name: Carica l'installer generato nella Release di GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
