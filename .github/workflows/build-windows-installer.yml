name: Build Windows 64-bit Installer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'local-network'
        type: choice
        options:
        - local-network
        - production

  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Controlla il codice sorgente
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configura Java (JDK 21 x64)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64
        cache: 'maven'

    - name: Recupera il certificato dal repository esterno
      if: ${{ github.event_name == 'release' || inputs.environment == 'local-network' }}
      env:
        SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        SOURCE_REPO_OWNER: mitchpisa76
        SOURCE_REPO_NAME: SNMPServer
        SECRET_NAME: LOCAL_SERVER_CERT
      shell: bash
      run: |
        # Recupera il secret dal repository esterno usando l'API di GitHub
        CERTIFICATE=$(curl -s -H "Authorization: token $SOURCE_REPO_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$SOURCE_REPO_OWNER/$SOURCE_REPO_NAME/actions/secrets/$SECRET_NAME" \
          | jq -r '.value // empty')
        
        if [ -n "$CERTIFICATE" ]; then
          echo "Certificato recuperato dal repository $SOURCE_REPO_OWNER/$SOURCE_REPO_NAME"
          echo "CERT_VALUE=$CERTIFICATE" >> $GITHUB_ENV
        else
          echo "ERRORE: Secret $SECRET_NAME non trovato in $SOURCE_REPO_OWNER/$SOURCE_REPO_NAME"
          exit 1
        fi

    - name: Importa certificato SSL nel JDK e nel cacerts della build
      if: ${{ github.event_name == 'release' || inputs.environment == 'local-network' }}
      shell: bash
      run: |
        if [ -n "${{ env.CERT_VALUE }}" ]; then
          echo "Certificato trovato. Importazione in corso..."
          
          # Crea la cartella di destinazione per la build
          mkdir -p src/main/resources/certs
          echo "${{ env.CERT_VALUE }}" > src/main/resources/certs/server.crt
          
          # Importa il certificato nel cacerts della JDK corrente (usato da Maven e jpackage)
          "$JAVA_HOME/bin/keytool" -importcert -alias resolve-server \
            -file "src/main/resources/certs/server.crt" \
            -keystore "$JAVA_HOME/lib/security/cacerts" \
            -storepass changeit -noprompt
            
          echo "Certificato importato nel JDK: $JAVA_HOME"
          echo "JAVA_CERT_IMPORTED=true" >> $GITHUB_ENV
        else
          echo "ATTENZIONE: Certificato non disponibile!"
          exit 1
        fi

    - name: Costruisci il progetto e l'installer con Maven
      env:
        _JAVA_OPTIONS: "-Dcom.sun.jndi.ldap.connect.pool=false"
      run: mvn clean verify

    - name: Importa certificato nel cacerts del runtime bundled nell'installer
      if: ${{ (github.event_name == 'release' || inputs.environment == 'local-network') && env.JAVA_CERT_IMPORTED == 'true' }}
      shell: bash
      run: |
        # Cerca il runtime Java bundled creato da jpackage
        BUNDLED_JAVA=$(find target/dist -name "runtime" -type d | head -n 1)
        
        if [ -n "$BUNDLED_JAVA" ] && [ -d "$BUNDLED_JAVA" ]; then
          BUNDLED_CACERTS="$BUNDLED_JAVA/lib/security/cacerts"
          
          if [ -f "$BUNDLED_CACERTS" ]; then
            echo "Certificato trovato nel runtime bundled: $BUNDLED_JAVA"
            
            # Importa il certificato nel cacerts del runtime bundled
            "$BUNDLED_JAVA/bin/keytool" -importcert -alias resolve-server \
              -file "src/main/resources/certs/server.crt" \
              -keystore "$BUNDLED_CACERTS" \
              -storepass changeit -noprompt
              
            echo "Certificato importato nel runtime bundled con successo."
          else
            echo "AVVISO: File cacerts non trovato in $BUNDLED_JAVA/lib/security/"
          fi
        else
          echo "AVVISO: Runtime Java bundled non trovato. Sarà creato durante la build."
        fi

    - name: Aggiungi nuova versione al README.md
      if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
      shell: bash
      run: |
        # Recupera o assegna il nome del tag
        TAG_NAME="${{ github.event.release.tag_name }}"
        if [ -z "$TAG_NAME" ]; then
          TAG_NAME="v1.0.0-manual"
        fi
        
        # Recupera la data corrente in formato YYYY-MM-DD
        RELEASE_DATE=$(date +'%Y-%m-%d %H:%M')
        
        # Isola il nome del file .exe
        EXE_FILE=$(basename $(ls target/dist/*.exe | grep -v 'temp' | head -n 1))
        DOWNLOAD_URL="https://github.com/MitchPisa76/MFPCrawler/releases/download/$TAG_NAME/$EXE_FILE"
        
        # Costruisce la nuova riga con Versione, Data e Link
        NEW_ROW="| **$TAG_NAME** | $RELEASE_DATE | [⚡ Scarica $EXE_FILE]($DOWNLOAD_URL) |"
        
        # Inserisce la riga in cima subito sotto il marcatore
        sed -i "/<!-- DOWNLOAD_TABLE_MARKER -->/a $NEW_ROW\n" README.md
        
        # Commit e Push
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: aggiornato README per la versione $TAG_NAME [skip ci]" && git push)

    - name: Carica l'installer nella Release di GitHub
      if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        files: target/dist/*.exe
        tag_name: ${{ github.event.release.tag_name || 'v1.0.0-manual' }}
        name: ${{ github.event.release.name || 'Build Manuale - MFPCrawler' }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Salva l'installer come Artifact (dalla pressione del pulsante manuale)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: actions/upload-artifact@v4
      with:
        name: MFPCrawler-Windows-Installer
        path: target/dist/*.exe
